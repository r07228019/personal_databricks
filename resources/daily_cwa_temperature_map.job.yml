resources:
  jobs:
    dailyCWATemperatureMap:
      name: dailyCWATemperatureMap
      description: 每天 18:00（台北）抓取中央氣象署當天 13:00 的溫度分布圖，存入 UC Volume。
      tags:
        project-name: cwa
        job-type: crawler
      max_concurrent_runs: 1
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: "0 0 18 * * ?"
        timezone_id: Asia/Taipei
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: data_date
          default: ""
        - name: data_hour
          default: ""
        - name: config_path
          default: ""
        - name: repo_root
          default: ${workspace.file_path}
      tasks:
        - task_key: download_temperature_map
          notebook_task:
            notebook_path: ../src/jobs/test/DailyCWATemperatureMap/daily_cwa_temperature_map.py
          timeout_seconds: 1800
