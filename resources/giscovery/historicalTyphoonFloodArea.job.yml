# 由 scripts/gen_crawler_jobs.py 依 src/jobs/config/data/cfh-gis20-ddb-crawler-config.jsonl 自動產生，
# 不要手改；改 jsonl 後重新執行 `python scripts/gen_crawler_jobs.py`。

resources:
  jobs:
    historicalTyphoonFloodArea:
      name: historicalTyphoonFloodArea
      description: "giscovery 爬蟲 historicalTyphoonFloodArea（category=geo），來源 https://opendata.wra.gov.tw/cloud/HistoricalFloodingArea/210-%E6%AD%B7%E5%B9%B4%E9%A2%B1%E9%A2%A8%E6%B7%B9%E6%B0%B4%E7%AF%84%E5%9C%8D.kml"
      tags:
        project-name: giscovery
        job-type: crawler
        task_name: historicalTyphoonFloodArea
        category: geo
      max_concurrent_runs: 1
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: "0 0 20 * * ? *"
        timezone_id: Asia/Taipei
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - ${var.notification_email}
      environments:
        - environment_key: crawler
          spec:
            client: "2"
            dependencies:
              - beautifulsoup4
              - paramiko
      parameters:
        - name: task_name
          default: historicalTyphoonFloodArea
        - name: config_table
          default: ${var.catalog}.${var.giscovery_schema}.crawler_config
        - name: sink_catalog
          default: ${var.catalog}
        - name: sink_schema
          default: ${var.giscovery_schema}
        - name: sink_volume
          default: ${var.crawlersink_volume}
        - name: repo_root
          default: ${workspace.file_path}
      tasks:
        - task_key: crawl
          environment_key: crawler
          notebook_task:
            notebook_path: ../../src/jobs/giscovery/run_crawler.py
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 300000
        - task_key: etl
          depends_on:
            - task_key: crawl
          run_job_task:
            job_id: ${resources.jobs.crawlerEtl.id}
            job_parameters:
              task_name: historicalTyphoonFloodArea
