# 由 scripts/gen_crawler_jobs.py 依 src/jobs/config/data/cfh-gis20-ddb-crawler-config.jsonl 自動產生，
# 不要手改；改 jsonl 後重新執行 `python scripts/gen_crawler_jobs.py`。

resources:
  jobs:
    soilLiquefaction:
      name: soilLiquefaction
      description: "giscovery 爬蟲 soilLiquefaction（category=geo），來源 https://data.gov.tw/dataset/28691。【排程暫停】目錄檔來源 www.gsmma.gov.tw 對 Databricks serverless（AWS us-east-2）的連線回 HTTP 403，從台灣 IP 可正常下載；另外 51 個 GeoJSON 在 www.geologycloud.tw，連續下載疑似會被限流（未證實）"
      tags:
        project-name: giscovery
        job-type: crawler
        task_name: soilLiquefaction
        category: geo
      max_concurrent_runs: 1
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: "0 0 16 1 3 ? *"
        timezone_id: Asia/Taipei
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.notification_email}
      environments:
        - environment_key: crawler
          spec:
            environment_version: "3"
            dependencies:
              - beautifulsoup4
              - paramiko
      parameters:
        - name: task_name
          default: soilLiquefaction
        - name: config_table
          default: ${var.catalog}.${var.giscovery_schema}.crawler_config
        - name: sink_catalog
          default: ${var.catalog}
        - name: sink_schema
          default: ${var.giscovery_schema}
        - name: sink_volume
          default: ${var.crawlersink_volume}
        - name: repo_root
          default: ${workspace.file_path}
      tasks:
        - task_key: crawl
          environment_key: crawler
          notebook_task:
            notebook_path: ../../src/jobs/giscovery/run_crawler.py
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 300000
        - task_key: etl
          depends_on:
            - task_key: crawl
          run_job_task:
            job_id: ${resources.jobs.crawlerEtl.id}
            job_parameters:
              task_name: soilLiquefaction
