resources:
  jobs:
    updateGiscoveryConfig:
      name: updateGiscoveryConfig
      description: 把 src/jobs/config/data/*.jsonl 同步到 Delta 設定表（crawler_config / etl_config）。無排程；GitHub Actions 部署完會自動執行並等它完成，也可手動執行。
      tags:
        project-name: giscovery
        job-type: config
      max_concurrent_runs: 1
      performance_target: STANDARD
      email_notifications:
        on_failure:
          - ${var.notification_email}
      environments:
        - environment_key: config
          spec:
            environment_version: "3"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.giscovery_schema}
        - name: data_dir
          default: ""
      tasks:
        - task_key: sync_config_tables
          environment_key: config
          notebook_task:
            notebook_path: ../src/jobs/config/update_giscovery_config.py
          timeout_seconds: 900
