[pytest]
# 在 repo 根目錄執行：pytest
# pythonpath 模擬 Databricks 上的 import 行為：
#   - repo 根目錄 → import common
#   - 各 job 目錄（notebook 的工作目錄）→ import 該 job 的專屬套件
# 新增 job 時，把它的目錄加到 pythonpath。
testpaths = tests
pythonpath =
    .
    src/jobs/test/DailyCWATemperatureMap
    src/jobs/giscovery
    src/jobs/config
# importlib 模式：不同資料夾可以有同名的測試檔
addopts = --import-mode=importlib
